name: Conta de luz CEEE
on:
  schedule:
    - cron: "17 22 * * 1,4"   # segunda e quinta, 19h17 em Brasília
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar leitor de PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Ler faturas no Gmail
        id: ler
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/ceee.py
      - name: Gravar contas.json
        if: steps.ler.outputs.msg != ''
        run: |
          git config user.name "robo-ora5"
          git config user.email "robo-ora5@users.noreply.github.com"
          git add contas.json
          git commit -m "${{ steps.ler.outputs.msg }}"
          git push
